<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1230" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seq" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="assoc" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#555555" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="1230" fill="#ffffff"/>
  <text x="630" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">helm_fetcher — per-repository keep / drop classification (full mode)</text>

  <!-- ============ SEQUENCE FLOWS (solid) ============ -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none" marker-end="url(#seq)">
    <path d="M330,104 L330,116"/>              <!-- start -> clone -->
    <path d="M330,166 L330,213"/>              <!-- clone -> gClone -->
    <path d="M296,247 L162,247"/>              <!-- gClone no -> skip -->
    <path d="M330,281 L330,312"/>              <!-- gClone yes -> discover -->
    <path d="M330,370 L330,397"/>              <!-- discover -> depbuild -->
    <path d="M330,453 L330,482"/>              <!-- depbuild -> template -->
    <path d="M330,540 L330,569"/>              <!-- template -> agg -->
    <path d="M330,623 L330,668"/>              <!-- agg -> gDep -->
    <path d="M364,702 L533,702"/>              <!-- gDep yes -> dep -->
    <path d="M330,736 L330,788"/>              <!-- gDep no -> gFail -->
    <path d="M747,702 L826,702"/>              <!-- dep -> depOut -->
    <path d="M994,702 L1096,702"/>             <!-- depOut -> eDep -->
    <path d="M364,822 L533,822"/>              <!-- gFail yes -> kept -->
    <path d="M330,856 L330,906"/>              <!-- gFail no -> removed -->
    <path d="M747,822 L826,822"/>              <!-- kept -> keptOut -->
    <path d="M994,822 L1096,822"/>             <!-- keptOut -> eKept -->
    <path d="M330,958 L330,1003"/>             <!-- removed -> gKeep -->
    <path d="M364,1037 L533,1037"/>            <!-- gKeep no -> delClone -->
    <path d="M638,1063 L638,1142 L354,1142"/>  <!-- delClone -> eRem -->
    <path d="M330,1071 L330,1120"/>            <!-- gKeep yes(retain) -> eRem -->
  </g>

  <!-- ============ DATA ASSOCIATIONS (dashed) ============ -->
  <g stroke="#555555" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#assoc)">
    <path d="M446,930 L826,930"/>                        <!-- removed -> remOut -->
    <path d="M700,730 C820,860 860,980 900,1108"/>        <!-- dep  -> allOut -->
    <path d="M700,842 C830,930 870,1010 902,1106"/>       <!-- kept -> allOut -->
    <path d="M400,956 C560,1050 760,1090 862,1120"/>      <!-- removed -> allOut -->
  </g>

  <!-- ============ EVENTS ============ -->
  <circle cx="330" cy="82" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="140" cy="247" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="1120" cy="702" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="1120" cy="822" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="330" cy="1142" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- ============ GATEWAYS ============ -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="#ffffff">
    <polygon points="330,213 364,247 330,281 296,247"/>
    <polygon points="330,668 364,702 330,736 296,702"/>
    <polygon points="330,788 364,822 330,856 296,822"/>
    <polygon points="330,1003 364,1037 330,1071 296,1037"/>
  </g>
  <g font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <text x="330" y="252">&#215;</text>
    <text x="330" y="707">&#215;</text>
    <text x="330" y="827">&#215;</text>
    <text x="330" y="1042">&#215;</text>
  </g>

  <!-- ============ TASKS ============ -->
  <g stroke="#1a1a1a" stroke-width="1.6" fill="#ffffff">
    <rect x="215" y="116" width="230" height="50" rx="9"/>
    <rect x="215" y="312" width="230" height="58" rx="9"/>
    <rect x="215" y="397" width="230" height="56" rx="9"/>
    <rect x="215" y="482" width="230" height="58" rx="9"/>
    <rect x="215" y="567" width="230" height="56" rx="9"/>
    <rect x="533" y="674" width="214" height="56" rx="9"/>
    <rect x="533" y="796" width="214" height="52" rx="9"/>
    <rect x="215" y="906" width="230" height="52" rx="9"/>
    <rect x="533" y="1013" width="214" height="48" rx="9"/>
  </g>

  <!-- ============ DATA OBJECTS ============ -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="#ffffff">
    <path d="M830,670 L976,670 L990,684 L990,734 L830,734 Z"/>
    <path d="M976,670 L976,684 L990,684"/>
    <path d="M830,790 L976,790 L990,804 L990,854 L830,854 Z"/>
    <path d="M976,790 L976,804 L990,804"/>
    <path d="M830,900 L976,900 L990,914 L990,964 L830,964 Z"/>
    <path d="M976,900 L976,914 L990,914"/>
    <path d="M815,1105 L989,1105 L1005,1121 L1005,1177 L815,1177 Z"/>
    <path d="M989,1105 L989,1121 L1005,1121"/>
  </g>

  <!-- ============ TEXT: tasks ============ -->
  <g font-size="12.5" fill="#1a1a1a" text-anchor="middle">
    <text x="330" y="137">Clone repository</text><text x="330" y="153" font-size="11" fill="#555555">git clone</text>
    <text x="330" y="333">Discover charts</text><text x="330" y="349" font-size="11" fill="#555555">FindCharts + collapse</text><text x="330" y="363" font-size="11" fill="#555555">vendored subcharts</text>
    <text x="330" y="422">helm dependency build</text><text x="330" y="438" font-size="11" fill="#555555">(per chart)</text>
    <text x="330" y="503">helm template</text><text x="330" y="519" font-size="11" fill="#555555">default + every value-file combo</text><text x="330" y="533" font-size="11" fill="#555555">&#8594; records runs</text>
    <text x="330" y="590">Aggregate per repo:</text><text x="330" y="606" font-size="11" fill="#555555">DepFailures / Failures / Successes</text>
    <text x="640" y="694" font-weight="700">DepFailed = true</text><text x="640" y="709">Kept = false</text><text x="640" y="723" font-size="11" fill="#555555">clone retained</text>
    <text x="640" y="817" font-weight="700">Kept = true</text><text x="640" y="833" font-size="11" fill="#555555">clone retained</text>
    <text x="330" y="927" font-weight="700">Kept = false</text><text x="330" y="943" font-size="11" fill="#555555">(clean — no failures)</text>
    <text x="640" y="1042">Delete clone dir</text>
  </g>

  <!-- ============ TEXT: data objects (generic catalogs) ============ -->
  <g font-size="11" fill="#1a1a1a" text-anchor="middle">
    <text x="908" y="700">Dependency-failure</text><text x="908" y="714">catalog</text>
    <text x="908" y="820">Kept catalog</text><text x="908" y="834" font-size="10" fill="#555555">(template failures)</text>
    <text x="908" y="930">Removed catalog</text><text x="908" y="944" font-size="10" fill="#555555">(clean repos)</text>
    <text x="908" y="1132" font-weight="700">Full catalog</text><text x="908" y="1147">(all repos)</text>
  </g>

  <!-- ============ TEXT: events ============ -->
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="330" y="86" font-size="11.5" font-weight="600">Seeded repo</text>
    <text x="140" y="290" font-size="12" font-weight="600">Not cataloged</text>
    <text x="1120" y="742" font-size="12.5" font-weight="700">Dep-Failed</text>
    <text x="1120" y="862" font-size="12.5" font-weight="700">Kept</text>
    <text x="330" y="1187" font-size="12.5" font-weight="700">Removed</text>
  </g>

  <!-- ============ TEXT: gateway questions & flow labels ============ -->
  <g font-size="11.5" fill="#333333">
    <text x="376" y="205">clone OK &amp; chart found?</text>
    <text x="270" y="706" text-anchor="end">DepFailures &gt; 0 ?</text>
    <text x="270" y="826" text-anchor="end">Failures &gt; 0 ?</text>
    <text x="270" y="1041" text-anchor="end">-keep-clones ?</text>
  </g>
  <g font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <rect x="215" y="238" width="24" height="15" fill="#ffffff"/><text x="227" y="250">no</text>
    <rect x="337" y="292" width="26" height="15" fill="#ffffff"/><text x="350" y="304">yes</text>
    <rect x="430" y="690" width="26" height="15" fill="#ffffff"/><text x="443" y="702">yes</text>
    <rect x="337" y="752" width="24" height="15" fill="#ffffff"/><text x="349" y="764">no</text>
    <rect x="430" y="810" width="26" height="15" fill="#ffffff"/><text x="443" y="822">yes</text>
    <rect x="337" y="872" width="24" height="15" fill="#ffffff"/><text x="349" y="884">no</text>
    <rect x="430" y="1025" width="24" height="15" fill="#ffffff"/><text x="442" y="1037">no</text>
    <rect x="300" y="1088" width="118" height="15" fill="#ffffff"/><text x="359" y="1100" font-weight="600">yes — retain clone</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(1000,120)">
    <rect x="0" y="0" width="245" height="196" rx="8" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="12" y="22" font-size="13" font-weight="700" fill="#1a1a1a">Legend (BPMN)</text>
    <circle cx="24" cy="44" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="44" y="48" font-size="12" fill="#333333">Start event</text>
    <circle cx="24" cy="72" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="3.5"/><text x="44" y="76" font-size="12" fill="#333333">End event</text>
    <rect x="14" y="90" width="20" height="16" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="44" y="103" font-size="12" fill="#333333">Task</text>
    <polygon points="24,120 34,130 24,140 14,130" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="44" y="134" font-size="12" fill="#333333">Exclusive gateway</text>
    <rect x="14" y="150" width="16" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><path d="M26,150 L26,154 L30,154" fill="none" stroke="#1a1a1a" stroke-width="1.4"/><text x="44" y="163" font-size="12" fill="#333333">Data object (output)</text>
    <line x1="14" y1="182" x2="38" y2="182" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#seq)"/><text x="46" y="186" font-size="11" fill="#333333">sequence flow</text>
  </g>

  <text x="20" y="1210" font-size="11" fill="#555555">Dep-failure gateway is evaluated first (repo-level). Every outcome is also recorded in the full catalog (dashed data associations).</text>
</svg>
